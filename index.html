<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Undangan Pernikahan - Clara & Peter</title>
  
  <style>
    @font-face {
      font-family: 'Hangyaboly';
      src: url('./fonts/hangyaboly.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #fff9e3;
      font-family: 'Hangyaboly', cursive, sans-serif;
      overflow-x: hidden;
    }

    /* Container pembungkus di layar Desktop agar tetap mobile 390px */
    .viewport-wrapper {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1e1e1e; /* Background luar netral gelap untuk desktop */
    }

    /* Frame Utama Undangan */
    .mobile-frame {
      position: relative;
      width: 390px;
      height: 606px; /* Sesuai rasio 1366:2122 pada lebar 390px */
      background-color: #fff9e3;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
    }

    /* Tampilan HP / Layar Mobile: Melebar penuh pas layar HP tanpa sidebar hitam */
    @media (max-width: 480px) {
      .viewport-wrapper {
        background-color: #fff9e3;
        align-items: flex-start;
      }
      .mobile-frame {
        width: 100vw;
        height: calc(100vw * (2122 / 1366));
        max-width: 100vw;
        box-shadow: none;
      }
    }

    /* Background Grafis Cover Canva (Bingkai, Ilustrasi Pengantin, Sparkles) */
    .cover-art {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('./assets/cover_bg.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 1;
    }

    /* Konten Teks dan Interaksi */
    .cover-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Judul atas: "these kids decided on forever" (Top: 17.48% dari atas) */
    .title-wrapper {
      position: absolute;
      top: 17.48%;
      width: 100%;
      left: 0;
      padding: 0 4%;
    }

    .title-line {
      font-family: 'Hangyaboly', cursive, sans-serif;
      font-size: clamp(24px, 8.2vw, 32px);
      line-height: 1.18;
      color: #bb2c3e;
      letter-spacing: 0.2px;
      font-weight: normal;
    }

    /* Nama Mempelai: "Clara & Peter" (Top: 77.19% dari atas) */
    .names-wrapper {
      position: absolute;
      top: 77.19%;
      width: 100%;
      left: 0;
    }

    .names-text {
      font-family: 'Hangyaboly', cursive, sans-serif;
      font-size: clamp(16px, 5.4vw, 21px);
      line-height: 1;
      color: #bb2c3e;
      letter-spacing: 0.5px;
      font-weight: normal;
    }

    /* Tombol Interaktif "Open Invitation" (Top: 83.22% dari atas) */
    .btn-wrapper {
      position: absolute;
      top: 83.22%;
      left: 50%;
      transform: translateX(-50%);
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(92px, 27.89vw, 109px);
      height: clamp(22px, 6.7vw, 26.5px);
      background-color: #a63232;
      color: #ffffff;
      font-family: 'Hangyaboly', cursive, sans-serif;
      font-size: clamp(12px, 3.7vw, 14.5px);
      text-decoration: none;
      border: none;
      border-radius: 6.5px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(166, 50, 50, 0.35);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease, background-color 0.2s ease;
      letter-spacing: 0.2px;
      padding-top: 1px;
    }

    .btn-open:hover {
      background-color: #bb2c3e;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(187, 44, 62, 0.45);
    }

    .btn-open:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <main class="mobile-frame" id="cover">
      <!-- Background Artwork Canva Cover -->
      <div class="cover-art" aria-hidden="true"></div>

      <!-- Teks & Tombol -->
      <div class="cover-content">
        <div class="title-wrapper">
          <h1 class="title-line">these kids decided<br>on forever</h1>
        </div>

        <div class="names-wrapper">
          <h2 class="names-text">Clara & Peter</h2>
        </div>

        <div class="btn-wrapper">
          <button type="button" class="btn-open" onclick="handleOpenInvitation()">
            Open Invitation
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function handleOpenInvitation() {
      console.log('Undangan dibuka!');
    }
  </script>
</body>
</html>
